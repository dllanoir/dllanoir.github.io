name: Publicar Aniversário de Bethânia (04.10)

on:
  schedule:
    # 03:00 UTC = 00:00 Horário de Brasília (UTC-3) do dia 04/10/2026
    - cron: '0 3 4 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar arquivos da edição de aniversário
        run: |
          cp _aniversario-04-10/index.html ./index.html
          cp _aniversario-04-10/styles.css ./styles.css
          cp _aniversario-04-10/script.js ./script.js

      - name: Commit e push para main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada para commit."
          else
            git commit -m "Publica edição especial de aniversário de Bethânia (04.10)"
            git push origin main
          fi
