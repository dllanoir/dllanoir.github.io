<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    
    <!-- Fonte minimalista e profissional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- Ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Variáveis de cor para um tema escuro profissional e neutro */
        :root {
            --bg-color: #0f172a; /* Azul muito escuro/Ardósia */
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981; /* Verde esmeralda (indicando sucesso/segurança) */
            --accent-hover: #059669;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container principal */
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        /* Área onde a senha gerada aparece */
        .password-display {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .password-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            word-break: break-all;
            color: var(--accent);
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
            padding: 5px;
        }

        .copy-btn:hover {
            color: var(--text-main);
        }

        /* Estilos dos controles de configuração */
        .setting-group {
            margin-bottom: 20px;
        }

        .length-slider-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Customização do slider (input type="range") */
        input[type="range"] {
            width: 100%;
            margin-bottom: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Checkboxes customizados */
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        /* Botão principal de ação */
        .generate-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .generate-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Mensagem de copiado */
        .toast-msg {
            text-align: center;
            font-size: 0.85rem;
            color: var(--accent);
            margin-top: 15px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gerador de Senhas</h1>
        
        <div class="password-display">
            <span class="password-text" id="password-result">SenhaAqui</span>
            <button class="copy-btn" id="copy-btn" title="Copiar senha">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>

        <div class="setting-group">
            <div class="length-slider-container">
                <label for="pwd-length">Tamanho da senha</label>
                <span id="length-value">16</span>
            </div>
            <input type="range" id="pwd-length" min="6" max="32" value="16">
        </div>

        <div class="setting-group">
            <label class="checkbox-container">
                Letras Maiúsculas (A-Z)
                <input type="checkbox" id="inc-uppercase" checked>
            </label>
            <label class="checkbox-container">
                Letras Minúsculas (a-z)
                <input type="checkbox" id="inc-lowercase" checked>
            </label>
            <label class="checkbox-container">
                Números (0-9)
                <input type="checkbox" id="inc-numbers" checked>
            </label>
            <label class="checkbox-container">
                Símbolos (!@#$%)
                <input type="checkbox" id="inc-symbols" checked>
            </label>
        </div>

        <button class="generate-btn" id="generate-btn">Gerar Senha</button>
        
        <div class="toast-msg" id="toast">Senha copiada com sucesso!</div>
    </div>

    <script>
        // Seleção dos elementos do DOM
        const resultEl = document.getElementById('password-result');
        const lengthEl = document.getElementById('pwd-length');
        const lengthValEl = document.getElementById('length-value');
        const uppercaseEl = document.getElementById('inc-uppercase');
        const lowercaseEl = document.getElementById('inc-lowercase');
        const numbersEl = document.getElementById('inc-numbers');
        const symbolsEl = document.getElementById('inc-symbols');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const toastEl = document.getElementById('toast');

        // Conjuntos de caracteres disponíveis
        const randomFunc = {
            lower: getRandomLower,
            upper: getRandomUpper,
            number: getRandomNumber,
            symbol: getRandomSymbol
        };

        // Funções para gerar caracteres aleatórios usando a tabela ASCII
        function getRandomLower() {
            return String.fromCharCode(Math.floor(Math.random() * 26) + 97);
        }

        function getRandomUpper() {
            return String.fromCharCode(Math.floor(Math.random() * 26) + 65);
        }

        function getRandomNumber() {
            return String.fromCharCode(Math.floor(Math.random() * 10) + 48);
        }

        function getRandomSymbol() {
            const symbols = '!@#$%^&*(){}[]=<>/,.';
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        // Atualiza o valor do tamanho da senha quando o slider é movido
        lengthEl.addEventListener('input', (e) => {
            lengthValEl.innerText = e.target.value;
        });

        // Evento de clique no botão de gerar
        generateBtn.addEventListener('click', () => {
            const length = +lengthEl.value; // Converte para número
            const hasLower = lowercaseEl.checked;
            const hasUpper = uppercaseEl.checked;
            const hasNumber = numbersEl.checked;
            const hasSymbol = symbolsEl.checked;

            resultEl.innerText = generatePassword(hasLower, hasUpper, hasNumber, hasSymbol, length);
        });

        // Função principal que constrói a senha
        function generatePassword(lower, upper, number, symbol, length) {
            let generatedPassword = '';
            const typesCount = lower + upper + number + symbol;
            
            // Array com os tipos de caracteres selecionados
            const typesArr = [{lower}, {upper}, {number}, {symbol}].filter(item => Object.values(item)[0]);
            
            // Se nenhum checkbox estiver marcado, retorna vazio
            if (typesCount === 0) {
                return '';
            }

            // Loop para gerar os caracteres
            for (let i = 0; i < length; i += typesCount) {
                typesArr.forEach(type => {
                    const funcName = Object.keys(type)[0];
                    generatedPassword += randomFunc[funcName]();
                });
            }

            // Embaralha e corta a senha para o tamanho exato solicitado
            const finalPassword = generatedPassword.slice(0, length);
            
            return finalPassword;
        }

        // Função para copiar a senha gerada
        copyBtn.addEventListener('click', () => {
            const textarea = document.createElement('textarea');
            const password = resultEl.innerText;

            if (!password || password === 'SenhaAqui' || password === '') {
                return;
            }

            textarea.value = password;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            textarea.remove();

            // Mostra a mensagem de sucesso (Toast)
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2500);
        });

        // Gera uma senha inicial ao carregar a página
        generateBtn.click();
    </script>
</body>
</html>
